    <title>LIFT</title>
    <!-- Apply dark mode instantly, before React loads, to prevent flash -->
    <script>
      (function() {
        var auto = localStorage.getItem('autoDarkMode');
        if (auto !== 'false') {
          var h = new Date().getHours();
          document.documentElement.classList.toggle('dark', h >= 19 || h < 7);
        } else {
          document.documentElement.classList.toggle('dark', localStorage.getItem('darkMode') === 'true');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root">
      <div id="splash" style="position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#000;z-index:9999;">
        <span style="color:#fff;font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display',system-ui,sans-serif;font-size:32px;font-weight:800;letter-spacing:2px;">LIFT</span>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
